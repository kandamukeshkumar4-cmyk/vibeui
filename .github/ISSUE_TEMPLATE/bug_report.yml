name: Bug Report
description: Something is broken
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug. Be as specific as possible so it can be reproduced.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Clear description of the bug
      placeholder: "When I click Generate, the app crashes with..."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to /playground
        2. Enter prompt "fitness app"
        3. Click Generate
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: Should show generated screens
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Frontend (Next.js)
        - Backend (FastAPI)
        - Database (Supabase)
        - Design generation pipeline
        - Auth
        - API keys
        - Agent workflows
        - CI / deployment
    validations:
      required: true

  - type: input
    id: url
    attributes:
      label: URL / route
      placeholder: "https://vibeui-web.vercel.app/playground"

  - type: textarea
    id: logs
    attributes:
      label: Console / server logs
      render: shell
